<div class="reminder-row">
  {{ r.id }}
  {{ r.method }}
  {{ r.amount }}
  {{ r.unit }}
  <span>before</span>
  <span class="delete">{{ r.DELETE }}</span>
  <button type="button" class="remove-reminder" aria-label="Remove notification" title="Remove">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"/>
      <path d="M10 11v6M14 11v6"/>
    </svg>
  </button>
  {% if r.errors %}<div style="flex-basis: 100%">{{ r.non_field_errors }}{{ r.amount.errors }}{{ r.unit.errors }}{{ r.method.errors }}</div>{% endif %}
</div>
